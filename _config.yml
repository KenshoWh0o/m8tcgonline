# Ce que GitHub Pages ne publie pas sur matetcg.com : la documentation, le code
# serveur (SQL, fonctions), les outils et le kit presse. Ils restent dans le dépôt
# (public sur GitHub : constaté le 8 novembre 2026, seul le propriétaire peut le
# rendre privé). Demande du propriétaire, 2 novembre 2026 : « il est hors de
# question que le code et la doc soit public ». Le meme fichier vit sur
# version-3.0 : publiee a la racine de main, la 3.0 le garde.
#
# Ne retirer aucune entrée ; y ajouter tout nouveau fichier de ce genre à la racine.
# Les dossiers qui commencent par « _ » ou « . » (_demo, .claude…) ne sont jamais
# publiés, sans qu'il faille les nommer ici.
exclude:
  - CLAUDE.md
  - README.md
  - SETUP.md
  - docs
  - tools
  - supabase
  - presse
